apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "run-claude-landing.fullname" . }}
  labels:
    {{- include "run-claude-landing.labels" . | nindent 4 }}
spec:
  replicas: {{ .Values.replicas }}
  selector:
    matchLabels:
      {{- include "run-claude-landing.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "run-claude-landing.selectorLabels" . | nindent 8 }}
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
      - name: web
        image: {{ .Values.image }}
        imagePullPolicy: Always
        ports:
        - containerPort: {{ .Values.port }}
          protocol: TCP
        env:
        - name: PORT
          value: {{ .Values.port | quote }}
        - name: PHX_HOST
          value: {{ .Values.domain | quote }}
        - name: HOLOGRAM_START
          value: "1"
        resources:
          {{- toYaml .Values.resources | nindent 10 }}
        livenessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
          initialDelaySeconds: 15
          periodSeconds: 30
        readinessProbe:
          httpGet:
            path: /healthz
            port: {{ .Values.port }}
          initialDelaySeconds: 5
          periodSeconds: 10
      restartPolicy: Always
