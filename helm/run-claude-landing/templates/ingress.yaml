{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "run-claude-landing.fullname" . }}
  labels:
    {{- include "run-claude-landing.labels" . | nindent 4 }}
  annotations:
    {{- toYaml .Values.ingress.annotations | nindent 4 }}
    {{- if .Values.ingress.cloudflareOnly }}
    nginx.ingress.kubernetes.io/whitelist-source-range: {{ include "run-claude-landing.cloudflareWhitelist" . | quote }}
    {{- end }}
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.tls.enabled }}
  tls:
  - hosts:
    - {{ .Values.domain }}
    secretName: {{ .Values.tls.secretName }}
  {{- end }}
  rules:
  - host: {{ .Values.domain }}
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: {{ include "run-claude-landing.fullname" . }}
            port:
              number: {{ .Values.port }}
{{- end }}
