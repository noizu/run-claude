# run-claude profiles
#
# Profile search order (first match wins):
# 1. ~/.config/run-claude/user.profiles.yaml
# 2. ~/.config/run-claude/profiles.yaml
# 3. <install>/user.profiles.yaml
# 4. <install>/profiles.yaml
#
# To disable a profile from a higher-priority file, set model: null or model: false
# Example:
#   cerebras:
#     model: null  # This disables cerebras, falling through to lower-priority files

# Anthropic - Native Claude models
anthropic:
  name: "Anthropic"
  fable_model: "claude-fable-5-1"
  opus_model: "claude-opus-5"
  sonnet_model: "claude-sonnet-5"
  haiku_model: "claude-haiku-4-5-20251001"
  extended:
    - "claude-fable-5-1[1m]"

# OpenAI - GPT models
openai:
  name: "OpenAI"
  opus_model: "openai-gpt5.5"
  sonnet_model: "openai-gpt5.4"
  haiku_model: "openai-gpt5.4-mini"
  extended:
    - "openai-gpt5.5-2026-04-23"
    - "openai-gpt4"
    - "openai-gpt4o"
    - "openai-gpt4o-mini"
    - "openai-o1"
    - "openai-o3-mini"

# Cerebras - Speed optimized inference
# Ladder: zai-glm-4.7 > qwen-3-235b > gpt-oss-120b > llama-3.3-70b
# (non-subscription CEREBRAS_API_KEY; gemma-4-31b was dropped from the catalog)
cerebras:
  name: "Cerebras"
  fable_model: "cerebras/zai-glm-4.7"
  opus_model: "cerebras/qwen-3-235b-a22b-instruct-2507"
  sonnet_model: "cerebras/gpt-oss-120b"
  haiku_model: "cerebras/llama-3.3-70b"

groq-pro:
  name: "Groq Equivalent"
  fable_model: "groq/gpt-oss-120b (high)"
  opus_model: "groq/gpt-oss-120b (medium)"
  sonnet_model: "groq-qwen3.6-27b"
  haiku_model: "groq/gpt-oss-20b (low)"
  # Claude Code v2.1.116+ appends "[1m]" for the 1M-context variants; register
  # aliases so those requests route instead of 404ing. Llama 3/4, Kimi K2, and
  # Qwen3-32b were shut down on Groq (2026); the live catalog is GPT-OSS,
  # Compound, Qwen3.6-27B, MiniMax M2.7, and the safety/guard models.
  extended:
    - "groq/gpt-oss-120b (high)[1m]"
    - "groq/gpt-oss-120b (medium)[1m]"
    - "groq/gpt-oss-20b (low)[1m]"
    - "groq-qwen3.6-27b[1m]"
    - "groq-qwen3.6-27b[1m]"
    - "groq/gpt-oss-120b (high)[1m]"
    - "groq/gpt-oss-120b (medium)[1m]"
    - "groq/gpt-oss-20b (low)[1m]"
    - "groq-compound"
    - "groq-compound-mini"
    - "groq-qwen3.6-27b"
    - "groq-gpt-oss-20b"
    - "groq-safety-gpt-oss-20b"
    - "groq-minimax-m2.7"


