name: CI

# Landing image (context: web/ — server-rendered Phoenix/Hologram on Bandit).
# PR: python-test (CLI pytest) + web-test (landing ExUnit) + docker smoke, in parallel.
# develop push: same jobs — seeds develop-ref caches that feature PRs can restore.
# main: push sha-* to ops.noizu.com (gated on all tests) then bump helm [skip ci].
# ArgoCD auto-syncs helm/run-claude-landing @ main.

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  # Never cancel release pushes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  REGISTRY: ops.noizu.com
  IMAGE: ops.noizu.com/run-claude.therobotlives.com/web

jobs:
  python-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install deps
        run: uv sync --group dev --frozen
      # Gate = floor(acceptance line %) - 5 (measured 40% on 2026-10-07).
      - name: pytest + coverage gate
        run: uv run pytest -q --cov --cov-report=term --cov-report=xml --cov-fail-under=35
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: python-coverage
          path: coverage.xml
          if-no-files-found: ignore

  web-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    env:
      MIX_ENV: test
      # Hologram routes 404 in :test unless this is set.
      HOLOGRAM_START: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: erlef/setup-beam@v1
        id: beam
        with:
          version-file: web/.tool-versions
          version-type: strict
      - uses: actions/cache@v4
        with:
          path: |
            web/deps
            web/_build
          key: ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-${{ hashFiles('web/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-${{ steps.beam.outputs.otp-version }}-${{ steps.beam.outputs.elixir-version }}-
      - run: mix deps.get
      - run: mix compile
      # threshold lives in mix.exs test_coverage.
      - run: mix test --cover
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: web-coverage
          path: web/cover
          if-no-files-found: ignore

  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      # Exports the gha cache too: build-push never ran (missing registry
      # secrets), so cache-from-only meant every build was cold.
      - name: Build landing image
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          load: true
          push: false
          tags: run-claude-landing:ci
          cache-from: type=gha,scope=web
          # PRs restore only; develop/main pushes export (stops PR cache churn).
          cache-to: ${{ github.event_name != 'pull_request' && 'type=gha,scope=web,mode=max' || '' }}
      - name: Probe /healthz and hero content
        run: |
          docker run -d --name rc-landing -p 8150:8150 run-claude-landing:ci
          trap 'docker rm -f rc-landing >/dev/null 2>&1 || true' EXIT
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:8150/healthz | grep -q ok; then
              PAGE=$(curl -fsS http://127.0.0.1:8150/)
              echo "$PAGE" | grep -q "Claude Code. Your models."
              echo "$PAGE" | grep -q "Tier mappings are one YAML stanza"
              echo "$PAGE" | grep -q "How it works"
              exit 0
            fi
            sleep 1
          done
          echo "landing smoke failed"
          docker logs rc-landing || true
          exit 1

  build-push:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [smoke, python-test, web-test]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require registry secrets
        env:
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PASSWORD: ${{ secrets.REGISTRY_PASSWORD }}
        run: |
          if [ -z "$REGISTRY_USER" ] || [ -z "$REGISTRY_PASSWORD" ]; then
            echo "::error::REGISTRY_USER / REGISTRY_PASSWORD missing on this repo"
            exit 1
          fi
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}
      - name: Short SHA
        id: sha
        run: echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - name: Build & push landing
        uses: docker/build-push-action@v6
        with:
          context: web
          platforms: linux/amd64
          push: true
          tags: ${{ env.IMAGE }}:sha-${{ steps.sha.outputs.short }}
          cache-from: type=gha,scope=web
          cache-to: type=gha,scope=web,mode=max

  bump-chart:
    needs: build-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Bump image tag
        run: |
          SHORT=${GITHUB_SHA::7}
          sed -i -E "s|(image: ops\.noizu\.com/run-claude\.therobotlives\.com/web:).*|\1sha-${SHORT}|" helm/run-claude-landing/values.yaml
      - name: Commit & push
        run: |
          git config user.name "run-claude-ci"
          git config user.email "ci@noizu.com"
          git add helm/run-claude-landing/values.yaml
          git diff --cached --quiet && exit 0
          git commit -m "ci: deploy sha-${GITHUB_SHA::7} [skip ci]"
          git push
  ci-timing:
    # PR-run timing tracker (fleet standard). Warn-only: never blocks.
    # Thresholds are repo/org Variables PR_STEP_MAX_MINUTES / PR_RUN_MAX_MINUTES, defaults 4/7.
    needs: [python-test, web-test, smoke]
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: Track timing thresholds
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          RUN_STARTED_AT: ${{ github.run_started_at }}
          STEP_MAX_MIN: ${{ vars.PR_STEP_MAX_MINUTES || '4' }}
          RUN_MAX_MIN: ${{ vars.PR_RUN_MAX_MINUTES || '7' }}
        run: |
          set -euo pipefail
          SUMMARY="$GITHUB_STEP_SUMMARY"
          jobs_json=""
          for i in 1 2 3; do
            jobs_json=$(curl -sf -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/runs/$RUN_ID/jobs?per_page=100") && break
            sleep 5
          done
          [ -n "$jobs_json" ] || { echo "::warning title=CI timing::could not fetch run jobs"; exit 0; }
          {
            echo "## CI timing (thresholds: step ${STEP_MAX_MIN}m / run ${RUN_MAX_MIN}m)"
            echo
            echo "| job | step | duration | status |"
            echo "|---|---|---|---|"
          } >> "$SUMMARY"
          flagged=0
          steps_sum=0
          while IFS=$'\t' read -r job step start end; do
            [ -n "$job" ] || continue
            s=$(date -d "$start" +%s); e=$(date -d "$end" +%s)
            dur=$((e - s)); thr=$((STEP_MAX_MIN * 60))
            steps_sum=$((steps_sum + dur))
            if [ "$dur" -gt "$thr" ]; then
              flagged=$((flagged + 1))
              echo "::warning title=CI timing::\"$step\" (job: $job) took $((dur / 60))m$((dur % 60))s — over the ${STEP_MAX_MIN}m step threshold"
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ⚠️ over ${STEP_MAX_MIN}m |" >> "$SUMMARY"
            else
              echo "| \`$job\` | \`$step\` | $((dur / 60))m$((dur % 60))s | ok |" >> "$SUMMARY"
            fi
          done < <(echo "$jobs_json" | jq -r '
            .jobs[] | select(.name | test("^(python-test|web-test|smoke)$")) | .name as $job |
            .steps[] | select(.status == "completed" and .conclusion != "skipped" and .conclusion != null) |
            [$job, .name, .started_at, .completed_at] | @tsv')
          start=$(date -d "$RUN_STARTED_AT" +%s); now=$(date +%s)
          wall=$((now - start)); run_thr=$((RUN_MAX_MIN * 60))
          echo
          echo "| **steps sum** | test jobs, work only | $((steps_sum / 60))m$((steps_sum % 60))s | $( [ "$steps_sum" -gt "$run_thr" ] && echo "⚠️ over ${RUN_MAX_MIN}m" || echo ok) |" >> "$SUMMARY"
          echo "| **wall clock** | queue + work | $((wall / 60))m$((wall % 60))s | info |" >> "$SUMMARY"
          if [ "$steps_sum" -gt "$run_thr" ]; then
            echo "::warning title=CI timing::acceptance steps sum to $((steps_sum / 60))m$((steps_sum % 60))s — over the ${RUN_MAX_MIN}m run threshold (wall clock: $((wall / 60))m)"
          fi
          echo; echo "_${flagged} step(s) over threshold._" >> "$SUMMARY"
