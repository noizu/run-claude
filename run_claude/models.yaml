# Base model definitions for run-claude
# These are the built-in model definitions that can be overridden by user definitions
# in ~/.config/run-claude/models.yaml
#
# Model names should be unique and descriptive

model_list:
  # ==========================================================================
  # Anthropic
  # ==========================================================================
  # Current Claude 5 family (ids per https://docs.anthropic.com/en/docs/about-claude/models).
  # Retired 2025 ids (claude-opus-4-20250514, claude-sonnet-4-20250514,
  # claude-3-5-haiku-20241022) return model_not_found and were removed 2026-09-21.
- model_name: "claude-fable-5-1"
  litellm_params:
    model: anthropic/claude-fable-5-1
    api_key: os.environ/ANTHROPIC_API_KEY
  metadata:
    provider: anthropic
    description: "Anthropic Fable 5.1 via API key (most capable GA model)"
    strengths: "Strongest reasoning, long agentic runs, nuanced writing"
    weaknesses: "Slowest, most expensive"

    pricing:
      text:
        in: 10.0
        out: 50.0
        cached_in: 1.0
      audio:
        in: null
        out: null
      image:
        in: 10.0
        out: null
      source: docs
    limits:
      max_input_tokens: 200000
      max_output_tokens: 65536
      max_thinking_tokens: 65536
    thinking:
      supported: true
      levels:
      - low
      - medium
      - high
      default_level: null
    tokens_per_second: 40
    notes: press reports conflicting $0.25 cache read; images tokenized at text rate
