# run-claude profiles
#
# Profile search order (first match wins):
# 1. ~/.config/run-claude/user.profiles.yaml
# 2. ~/.config/run-claude/profiles.yaml
# 3. <install>/user.profiles.yaml
# 4. <install>/profiles.yaml
#
# To disable a profile from a higher-priority file, set model: null or model: false
# Example:
#   cerebras:
#     model: null  # This disables cerebras, falling through to lower-priority files

# Anthropic - Native Claude models
anthropic:
  name: "Anthropic"
  opus_model: "claude-opus-4-20250514"
  sonnet_model: "claude-sonnet-4-20250514"
  haiku_model: "claude-3-5-haiku-20241022"

# OpenAI - GPT models
openai:
  name: "OpenAI"
  opus_model: "openai-gpt4"
  sonnet_model: "openai-gpt4o"
  haiku_model: "openai-gpt4o-mini"

# Cerebras - Speed optimized inference
# Only 3 models available now: gemma-4-31b, zai-glm-4.7, gpt-oss-120b
# (non-subscription CEREBRAS_API_KEY)
cerebras:
  name: "Cerebras"
  fable_model: "cerebras/zai-glm-4.7"
  opus_model: "cerebras/gemma-4-31b"
  sonnet_model: "cerebras/gpt-oss-120b"
  haiku_model: "cerebras/gpt-oss-120b"

groq-pro:
  name: "Groq Equivalent"
  opus_model: "groq/opus"
  sonnet_model: "groq/sonnet"
  haiku_model: "groq/haiku"
  extended:
    - "groq/opus[1m]"
    - "groq/sonnet[1m]"
    - "groq/haiku[1m]"
    - "groq-compound"
    - "groq-compound-mini"
    - "groq-qwen3.6-27b"
    - "groq-gpt-oss-20b"
    - "groq-minimax-m2.7"


# Z.AI Subscription - GLM with thinking tiers
#   fable  = glm-5.3
#   opus   = glm-5.3-flash
#   sonnet = glm-5.2
#   haiku  = glm-5-turbo
# Requires: ZAI_SUB_KEY; Tyna copies also need ZAI_SUB_KEY_TYNA
zai-pro:
  name: "Zai Subscription"
  opus_model: "zai/opus"
  sonnet_model: "zai/sonnet"
  haiku_model: "zai/haiku"
  fable_model: "zai/fable"
  extended:
    - "zai/opus[1m]"
    - "zai/sonnet[1m]"
    - "zai/haiku[1m]"
    - "zai/fable[1m]"
    - "zai-tyna/opus"
    - "zai-tyna/opus[1m]"
    - "zai-tyna/sonnet"
    - "zai-tyna/sonnet[1m]"
    - "zai-tyna/haiku"
    - "zai-tyna/haiku[1m]"
    - "zai-tyna/fable"
    - "zai-tyna/fable[1m]"
    - "zai/glm-5.3"
    - "zai/glm-5.3-flash"
    - "zai/glm-5.2"
    - "zai-oa/glm-5.3"
    - "zai-oa/glm-5.3-flash"
    - "zai-oa/glm-5.2"
    - "zai-oa/glm-5-turbo"
    - "zai-oa/glm-4.7"

# Z.AI Subscription - OpenAI v1 endpoint format
#   fable  = glm-5.3
#   opus   = glm-5.3-flash
#   sonnet = glm-5.2
#   haiku  = glm-4.7
zai-oa:
  name: "Zai Subscription (OpenAI v1)"
  fable_model: "zai-oa/glm-5.3"
  opus_model: "zai-oa/glm-5.3-flash"
  sonnet_model: "zai-oa/glm-5.2"
  haiku_model: "zai-oa/glm-4.7"
  extended:
    - "zai-oa/fable"
    - "zai-oa/opus"
    - "zai-oa/sonnet"
    - "zai-oa/haiku"
    - "zai-oa/glm-5.3"
    - "zai-oa/glm-5.3-flash"
    - "zai-oa/glm-5.2"
    - "zai-oa/glm-5-turbo"
    - "zai-oa/glm-4.7"

